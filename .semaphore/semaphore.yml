version: v1.0
name: ferbe

agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404

auto_cancel:
  running:
    when: "true"

fail_fast:
  cancel:
    when: branch != 'main'

global_job_config:
  secrets:
    - name: ferbe

  prologue:
    commands:
      - checkout --use-cache
      - source .semaphore/bin/cache_restore rails
      - bundle config set deployment 'true'
      - bundle config set path 'vendor/bundle'
      - bundle install

blocks:
  - name: linting
    dependencies: []
    execution_time_limit:
      minutes: 5
    task:
      jobs:
        - name: linting
          commands:
            - bin/fastcheck

  - name: tests
    dependencies: []
    execution_time_limit:
      minutes: 10
    task:
      env_vars:
        - name: RAILS_ENV
          value: test
      prologue:
        commands:
          - cp .env.example .env
      jobs:
        - name: tests
          commands:
            - bin/check
      epilogue:
        always:
          commands:
            - source .semaphore/bin/cache_store rails
            - mkdir -p log coverage
            - artifact push job log
            - zip -r coverage-$SEMAPHORE_GIT_SHA coverage/
            - artifact push job coverage-$SEMAPHORE_GIT_SHA.zip
